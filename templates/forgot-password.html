{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"content="width=device-width, initial-scale=1.0">
<meta name="description" content="Jesse - Professional Web Developer Portfolio">
<meta name="author"content="Jesse">
<meta name="keywords"content="Jesse, Web Developer, Python, Django, PHP, JavaScript, HTML, CSS, Bootstrap">
<!-- =====================================================
     BOOTSTRAP 5
====================================================== -->
<link href="{% static 'css/bootstrap.min.css'%}"
      rel="stylesheet">
<!-- =====================================================
     BOOTSTRAP ICONS
====================================================== -->
<link rel="stylesheet"
      href="{% static 'bootstrap-icons/font/bootstrap-icons.min.css'%}">
<!-- =====================================================
     GOOGLE FONTS
====================================================== -->
<link rel="preconnect"
      href="https://fonts.googleapis.com">
<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet">
<link rel="stylesheet" href="{% static 'style.css'%}">


</head>

<body>
{% block body %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card p-4 shadow">

                <h3 class="text-center mb-3">
                    Forgot Password
                </h3>
  
                <p class="text-center text-muted">
                    Enter your email address to receive a password reset link.
                </p>
                     {% if error %}
                    <div class="alert alert-danger">
                        {{ error }}
                    </div>
                {% endif %}
                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">Email Address</label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            placeholder="Enter your email"
                            required
                        >
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        Send Reset Link
                    </button>
                </form>

                <div class="text-center mt-3">
                    <a href="/login/">
                        Back to Login
                    </a>
                </div>

            </div>

        </div>
    </div>
</div>

{% endblock body %}

</body>
</html>
